name: Manual archive integrity check (does not refresh source)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check last successfully imported VPS snapshot
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("data")
          report=json.loads((root/"manual-refresh-report.json").read_text(encoding="utf-8"))
          index=json.loads((root/"index.json").read_text(encoding="utf-8"))
          files=list((root/"laws").glob("*.md"))
          print("status:",report.get("status"))
          print("last successful full refresh (UTC):",report.get("last_successful_full_refresh_utc"))
          print("law titles:",len(index),"texts:",len(files))
          assert report.get("status")=="success", "Latest imported refresh is not fully successful"
          assert report.get("last_successful_full_refresh_utc"), "No successful refresh timestamp"
          assert len(index)>=600 and len(files)>=600, "Archive unexpectedly small"
          assert report.get("failures_count")==0, "Refresh includes source download errors"
          print("Archive structure valid. This does NOT verify the legal currency of texts.")
          PY
