name: Manual Iranian laws refresh (run only on request)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full: all texts; missing: new/missing texts; index: titles only'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - missing
          - index

permissions:
  contents: write

concurrency:
  group: iran-laws-manual-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the fork
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install original project's dependencies
        run: |
          python -m pip install --disable-pip-version-check 'mcp>=1.0,<2' 'httpx>=0.27,<1' 'beautifulsoup4>=4.12,<5' 'lxml>=5,<7'

      - name: Fetch public laws (manual only)
        id: refresh
        continue-on-error: true
        run: |
          python scripts/manual_refresh.py --mode "${{ inputs.mode }}" --delay 1.5

      - name: Save changes and dated report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/index.json data/laws
          if [ -f data/manual-refresh-report.json ]; then
            git add data/manual-refresh-report.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'data: user-triggered Iranian laws refresh'
            git push
          else
            echo 'No index, text, or report changes to commit.'
          fi

      - name: Fail if any law could not be refreshed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'Refresh did not finish fully; inspect the report and log.'
          exit 1
